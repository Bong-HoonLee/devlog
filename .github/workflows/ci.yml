name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 빌드 검증은 Vercel 이 푸시/PR 마다 실제 환경변수로 수행하므로 여기서는 하지 않습니다.
# next build 는 generateStaticParams / sitemap / RSS 때문에 DB 연결이 필요한데,
# 그러자고 프로덕션 자격증명을 GitHub Secrets 에 두는 것은 얻는 것에 비해 위험합니다.
jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter web exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm --filter web exec tsc --noEmit
